# Static site config for the `nginxinc/nginx-unprivileged` image, which includes
# `/etc/nginx/conf.d/*.conf` from its main `nginx.conf`.

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;

    # The prerendered output uses extensionless files (`about.html`), so
    # requests for `/about` have to fall back to `$uri.html`.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Written by the prerenderer from `src/routes/404/+page.svelte`.
    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Vite emits content-hashed filenames under `_app/immutable`, so they can be
    # cached indefinitely.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

name: "Detect changed services"

on:
  workflow_call:
    outputs:
      www:
        value: ${{ jobs.detect-changes.outputs.www }}
      app:
        value: ${{ jobs.detect-changes.outputs.app }}
      api:
        value: ${{ jobs.detect-changes.outputs.api }}
      artoo:
        value: ${{ jobs.detect-changes.outputs.artoo }}
      forge:
        value: ${{ jobs.detect-changes.outputs.forge }}

jobs:
  detect-changes:
    name: "Detect changed services"
    runs-on: ubuntu-latest

    outputs:
      www: ${{ steps.filter.outputs.www }}
      app: ${{ steps.filter.outputs.app }}
      api: ${{ steps.filter.outputs.api }}
      artoo: ${{ steps.filter.outputs.artoo }}
      forge: ${{ steps.filter.outputs.forge }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths per service
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            www:
              - 'svc/www/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
            app:
              - 'svc/app/**'
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
            api:
              - 'svc/api/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            artoo:
              - 'svc/artoo/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            forge:
              - 'svc/forge/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

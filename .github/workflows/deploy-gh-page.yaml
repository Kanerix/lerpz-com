name: "Deploy GitHub Pages"

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (must match the directory under svc)."
        type: string
        required: true
      base-path:
        description: "Path the site is served from. Empty for a custom domain or an <owner>.github.io repo, otherwise /<repo>."
        type: string
        required: false
        default: ""

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "Build ${{ inputs.service }}"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: ${{ inputs.base-path }}
        run: bun --filter @lerpz/${{ inputs.service }} build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: svc/${{ inputs.service }}/build

  deploy:
    name: "Deploy ${{ inputs.service }} to GitHub Pages"
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      - name: Summary
        run: |
          echo "## Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ inputs.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Target | GitHub Pages |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | ${{ steps.deploy.outputs.page_url }} |" >> $GITHUB_STEP_SUMMARY

name: "Pipeline"

on:
  workflow_dispatch:
    inputs:
      www:
        description: "Force deploy www"
        type: boolean
        default: false
      app:
        description: "Force deploy app"
        type: boolean
        default: false
      api:
        description: "Force deploy api"
        type: boolean
        default: false
      artoo:
        description: "Force deploy artoo"
        type: boolean
        default: false
      forge:
        description: "Force deploy forge"
        type: boolean
        default: false
  push:
    branches:
      - main
      - dev

jobs:
  prepare:
    name: "Detect changes"
    uses: ./.github/workflows/prepare.yaml

  env:
    name: "Resolve environment"
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.resolve.outputs.name }}
    steps:
      - name: Resolve
        id: resolve
        run: echo "name=${{ github.ref_name == 'main' && 'prod' || 'stag' }}" >> $GITHUB_OUTPUT

  summary:
    name: "Changed services"
    runs-on: ubuntu-latest
    needs: [prepare, env]
    steps:
      - name: Print changed services
        run: |
          echo "## Changed Services" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| www | ${{ needs.prepare.outputs.www }} |" >> $GITHUB_STEP_SUMMARY
          echo "| app | ${{ needs.prepare.outputs.app }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api | ${{ needs.prepare.outputs.api }} |" >> $GITHUB_STEP_SUMMARY
          echo "| artoo | ${{ needs.prepare.outputs.artoo }} |" >> $GITHUB_STEP_SUMMARY
          echo "| forge | ${{ needs.prepare.outputs.forge }} |" >> $GITHUB_STEP_SUMMARY

  # www is a fully static site, so it deploys to GitHub Pages rather than to a
  # container app like the others. Pages serves a single site per repository, so
  # this only runs on main to keep dev pushes off the live company site.
  deploy-www:
    name: "Deploy www"
    needs: [prepare]
    if: |
      github.ref_name == 'main' &&
      (needs.prepare.outputs.www == 'true' || inputs.www == true)
    uses: ./.github/workflows/deploy-gh-page.yaml
    with:
      service: www
    permissions:
      contents: read
      pages: write
      id-token: write


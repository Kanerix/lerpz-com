apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `*-env` secrets, the `lerpz-tls` secret, and the app images are provided
# out-of-band (see the root README and k8s/justfile), because they come from
# private .env files, your mkcert certs, and locally-built Docker images.
resources:
  - namespace.yaml
  - infra/secrets.yaml
  - infra/postgres.yaml
  - infra/dragonfly.yaml
  - infra/qdrant.yaml
  - infra/minio.yaml
  - apps/www.yaml
  - apps/app.yaml
  - apps/api.yaml
  - apps/artoo.yaml
  - apps/forge.yaml
  - ingress/ingressroutes.yaml

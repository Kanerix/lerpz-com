# Traefik IngressRoutes — the cluster equivalent of the docker-compose Traefik
# labels/dynamic config. HTTP entrypoint = `web`, HTTPS = `websecure`.
#
# TLS uses the `lerpz-tls` secret. Create it from your mkcert certs with:
#   kubectl -n lerpz create secret tls lerpz-tls \
#     --cert=certs/cert.pem --key=certs/key.pem
#
# `forge` is deliberately absent: it provisions cluster infrastructure and is
# only ever called in-cluster by `api` and `artoo`, so it stays on its
# ClusterIP Service with no route in from outside.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: www
  namespace: lerpz
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`lerpz.local`) || Host(`www.lerpz.local`)
      kind: Rule
      services:
        - name: www
          port: 3000
  tls:
    secretName: lerpz-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app
  namespace: lerpz
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`app.lerpz.local`)
      kind: Rule
      services:
        - name: app
          port: 3001
  tls:
    secretName: lerpz-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: api
  namespace: lerpz
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`api.lerpz.local`)
      kind: Rule
      services:
        - name: api
          port: 4000
  tls:
    secretName: lerpz-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: artoo
  namespace: lerpz
spec:
  entryPoints: [web, websecure]
  routes:
    - match: Host(`agent.lerpz.local`)
      kind: Rule
      services:
        - name: artoo
          port: 4001
  tls:
    secretName: lerpz-tls

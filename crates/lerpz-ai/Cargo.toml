[package]
name = "lerpz-ai"
edition = "2024"
version.workspace = true

[features]
# Provides the `portkey` module with helpers for the Portkey AI gateway.
portkey = [
    "dep:secrecy",
    "dep:async-stream",
    "dep:base64",
    "dep:http",
    "dep:reqwest",
    "reqwest/json",
    "dep:tokio",
    "tokio/time",
    "dep:serde",
    "serde/derive",
]
# Provides `portkey::build_client`, a `rig-core` client pointed at the Portkey gateway.
rig = ["portkey", "dep:rig-core"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
async-openai = { workspace = true, features = ["byot", "chat-completion", "image"] }
rig-core = { workspace = true, optional = true }
http = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { workspace = true }
async-stream = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tracing = { workspace = true }

[lints]
workspace = true
